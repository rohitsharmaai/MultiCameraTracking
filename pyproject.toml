[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multicam-reid"
version = "0.1.0"
description = "Multi-camera person tracking, global identity, and re-identification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "MultiCameraTracking" }]
dependencies = [
    "numpy>=1.24",
    "opencv-contrib-python>=4.8",
    "PyYAML>=6.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "onnxruntime>=1.17",
    "torch>=2.1",
    "torchvision>=0.16",
    "scipy>=1.11",
    "shapely>=2.0",
    "prometheus-client>=0.20",
    "psutil>=5.9",
    "tqdm>=4.66",
    "httpx>=0.27",
    "huggingface_hub>=0.22",
    "rfdetr>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
process-video = "app.process_video:main"
gallery = "app.gallery:main"
mct-api = "src.api.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "unit: fast unit tests",
    "integration: component integration tests",
    "scenario: identity scenario tests",
    "gpu: requires GPU and downloaded models",
]

[tool.ruff]
line-length = 100
target-version = "py310"
